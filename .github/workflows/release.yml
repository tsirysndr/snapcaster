name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: macos-universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On manual dispatch, build the tag's code rather than the branch
          # the workflow was dispatched from.
          ref: ${{ inputs.tag || github.ref }}

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Set up rust
        run: fluentci run setup-rust setup --toolchain stable --targets aarch64-apple-darwin,x86_64-apple-darwin | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and package universal release with PureScript
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci macos-release --source "$GITHUB_WORKSPACE" --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.tar.gz*

    defaults:
      run:
        shell: bash
  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci github-assets --directory "$GITHUB_WORKSPACE/dist" --tag "$RELEASE_TAG" --create=true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
