name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: macos-universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On manual dispatch, build the tag's code rather than the branch
          # the workflow was dispatched from.
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures so we can lipo universal binaries — the
          # .driver bundle in particular must load on Intel and Apple Silicon.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI + driver (both arches)
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" --bin snapcaster
            cargo build --release --locked --target "$target" -p snapcaster-driver
          done

      - name: Assemble universal bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          name="snapcaster-${version}-macos-universal"
          stage="dist/staging"
          bundle="$stage/SnapcasterAudio.driver"

          mkdir -p "$stage" "$bundle/Contents/MacOS"

          # Universal CLI binary
          lipo -create -output "$stage/snapcaster" \
            target/aarch64-apple-darwin/release/snapcaster \
            target/x86_64-apple-darwin/release/snapcaster

          # Universal driver bundle
          cp driver/Info.plist "$bundle/Contents/Info.plist"
          lipo -create -output "$bundle/Contents/MacOS/SnapcasterAudio" \
            target/aarch64-apple-darwin/release/libsnapcaster_driver.dylib \
            target/x86_64-apple-darwin/release/libsnapcaster_driver.dylib
          codesign --force --sign - "$bundle"

          # Everything a user needs to install the prebuilt bundle
          cp scripts/install-prebuilt.sh "$stage/install.sh"
          cp scripts/uninstall-driver.sh "$stage/uninstall.sh"
          cp dist/com.tsirysndr.snapcaster.plist "$stage/"
          cp README.md LICENSE "$stage/"
          chmod +x "$stage/install.sh" "$stage/uninstall.sh"

          tar -C "$stage" -czf "dist/${name}.tar.gz" .
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          lipo -info "$stage/snapcaster" "$bundle/Contents/MacOS/SnapcasterAudio"
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.tar.gz*

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  homebrew:
    name: Update Homebrew tap
    needs: [build, release]
    runs-on: ubuntu-latest
    # Needs a PAT with write access to tsirysndr/homebrew-tap, stored as the
    # HOMEBREW_TAP_TOKEN repo secret. Skips cleanly if the secret is unset.
    if: ${{ github.repository == 'tsirysndr/snapcaster' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute version + sha256
        id: meta
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          tarball="dist/snapcaster-${version}-macos-universal.tar.gz"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bare=${version#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: tsirysndr/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula from the repo template
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          bare="${{ steps.meta.outputs.bare }}"
          sha="${{ steps.meta.outputs.sha256 }}"
          # Start from the committed formula and bump url/version/sha to this tag.
          mkdir -p tap/Formula
          sed -E \
            -e "s#/download/v[0-9][^/]*/snapcaster-v[0-9][^\"]*-macos-universal\.tar\.gz#/download/${version}/snapcaster-${version}-macos-universal.tar.gz#" \
            -e "s/^  version \"[^\"]*\"/  version \"${bare}\"/" \
            -e "s/^  sha256 \"[^\"]*\"/  sha256 \"${sha}\"/" \
            Formula/snapcaster.rb > tap/Formula/snapcaster.rb
          echo "----- rendered formula -----"
          head -8 tap/Formula/snapcaster.rb

      - name: Commit + push to tap
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/snapcaster.rb
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
          else
            git commit -m "snapcaster ${{ steps.meta.outputs.version }}"
            git push
          fi
